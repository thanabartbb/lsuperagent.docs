<!doctype html>
<html lang="th" data-responsive-nav="v2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Chat — lsuperagen.docs</title>
<meta name="description" content="พื้นที่สนทนา lsuperagen.docs">
<link rel="icon" href="/assets/ls-mascot.png">
<link rel="stylesheet" href="/assets/chat.css">
<script src="/assets/chat.js" defer></script>
</head>
<body>
<header class="header">
<a class="brand" href="/" aria-label="lsuperagen.docs หน้าแรก"><img src="/assets/ls-mascot.png" width="40" height="40" alt=""><span>lsuperagen<span class="muted">.docs</span></span></a>
<div class="header-actions">
<button class="icon-button" id="clear" aria-label="เริ่มแชทใหม่" title="เริ่มแชทใหม่"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="icon-button" id="open-menu" aria-label="เปิดเมนู" aria-haspopup="dialog" title="เมนู"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
</div>
</header>
<main class="chat" aria-label="สนทนากับ AI">
<div class="conversation" id="conversation">
<section class="empty" id="empty"><img src="/assets/ls-mascot.png" width="116" height="126" alt="มาสคอต lsuperagen.docs"><h1>เริ่มจากไอเดียของคุณ</h1></section>
<div class="log" id="log" role="log" aria-live="polite" aria-label="ข้อความสนทนา" aria-relevant="additions text"></div>
</div>
<div class="compose-wrap">
<p class="feedback" id="feedback" role="status" hidden></p>
<form class="composer" id="form">
<label class="sr-only" for="prompt">ข้อความของคุณ</label>
<textarea id="prompt" placeholder="ถามหรือเริ่มงานของคุณ…" rows="1" maxlength="4000" required></textarea>
<div class="composer-actions">
<button type="button" class="mode-button" id="open-settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span id="mode-label">ทั่วไป</span></button>
<button type="button" class="icon-button" id="stop" aria-label="หยุดรอคำตอบ" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
<button class="send icon-button" id="send" type="submit" aria-label="ส่งข้อความ" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
</div>
</form>
</div>
</main>
<dialog id="settings" aria-labelledby="settings-title">
<div class="dialog-head"><h2 id="settings-title">รูปแบบคำตอบ</h2><button class="icon-button close" aria-label="ปิด"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<label for="mode">เลือกโหมด</label><select id="mode"><option value="fast">ทั่วไป</option><option value="research">ค้นคว้า</option><option value="creative">สร้างสรรค์</option><option value="code">เขียนโค้ด</option></select>
<p class="muted">ส่งผ่าน OpenAI · แต่ละข้อความเป็นคำขอแยกกัน</p>
<p class="muted">โหมดค้นคว้าใช้ข้อมูลที่ส่งให้ ไม่ใช่การค้นเว็บสด</p>
<p class="muted">Enter เพื่อส่ง · Shift + Enter เพื่อขึ้นบรรทัดใหม่</p>
</dialog>
<dialog id="menu" aria-labelledby="menu-title"><div class="dialog-head"><h2 id="menu-title">lsuperagen.docs</h2><button class="icon-button close" aria-label="ปิด"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><nav aria-label="เมนูหลัก"><a href="/">หน้าแรก</a><a href="/getting-started">เอกสาร</a><a href="/tools">เครื่องมือ</a><a href="/login">เข้าสู่ระบบ</a></nav></dialog>
</body>
</html>
