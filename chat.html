<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <title>LSUPERAGENT · Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --line: #1f1f1f;
      --border: #2a2a2a;
      --text: #ffffff;
      --muted: #8e8e93;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: 24px 16px 16px;
      max-width: 860px;
      margin: 0 auto;
    }

    /* Top bar (same as the home page) */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }
    .brand svg { width: 28px; height: 28px; }
    .nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .nav a, .nav button {
      padding: 6px 10px;
      border-radius: 8px;
      color: var(--muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      background: none;
      border: 0;
      cursor: pointer;
    }
    .nav a:hover, .nav button:hover { color: var(--text); }
    .who { color: var(--muted); font-size: 13px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Model bar */
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .bar select {
      height: 38px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      max-width: 100%;
    }
    .bar .quota { color: var(--muted); font-size: 13px; margin-left: auto; }
    .btn-ghost {
      height: 38px;
      padding: 0 14px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-ghost:hover { border-color: #3a3a3a; }

    /* Chat */
    .chat {
      flex: 1;
      min-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: var(--surface);
    }
    .empty { color: var(--muted); text-align: center; padding: 48px 12px; font-size: 14px; line-height: 1.6; }
    .bubble {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.6;
    }
    .bubble.u { margin-left: auto; background: #1c1c1e; }
    .bubble.a { border: 1px solid var(--border); }
    .bubble.e { border: 1px solid #3a3a3a; color: var(--muted); }
    .bubble .meta { display: block; margin-top: 6px; font-size: 11px; color: #636366; }
    .bubble .btn-ghost { margin-top: 10px; }
    .thinking::after { content: ""; animation: dots 1.2s infinite; }
    @keyframes dots { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } 100% { content: "..."; } }

    /* Composer */
    .composer { display: flex; gap: 8px; margin-top: 12px; align-items: flex-end; }
    .composer textarea {
      flex: 1;
      min-height: 48px;
      max-height: 180px;
      resize: none;
      padding: 13px 14px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font: inherit;
      font-size: 15px;
      outline: none;
    }
    .composer textarea:focus { border-color: #4a4a4a; }
    .send {
      height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: var(--radius);
      background: #f5f5f5;
      color: #0a0a0a;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .send:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { margin-top: 8px; font-size: 12px; color: #636366; line-height: 1.5; }
    .hint a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <svg viewBox="30 20 144 160" aria-hidden="true"><path fill="#FFFFFF" fill-rule="evenodd" d="M104,30 L162,66 L163,133 L103,169 L103,139 L131,120 L103,101 Z M97,30 L41,66 L41,93 L94,63 Z M88,76 L41,102 L41,133 L94,168 L94,138 L63,119 L67,111 L93,96 L93,79 Z M126,72 L144,84 L143,108 L124,92 Z"/></svg>
      LSUPERAGENT SDK
    </a>
    <nav class="nav" aria-label="Sections">
      
      <span class="who" id="who"></span>
      <button type="button" id="signout">Sign out</button>
    </nav>
  </header>

  <div class="bar">
    <select id="provider" aria-label="Model" disabled><option>กำลังโหลดโมเดล…</option></select>
    <span class="quota" id="quota"></span>
    <button type="button" class="btn-ghost" id="clear">New chat</button>
  </div>

  <div class="chat" id="chat" aria-live="polite">
    <div class="empty" id="empty">ลองถามอะไรก็ได้เกี่ยวกับ AI SDK<br>เช่น "generateText ต่างจาก streamText ยังไง"</div>
  </div>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" maxlength="4000" placeholder="พิมพ์ข้อความ…" disabled></textarea>
    <button type="submit" class="send" id="send" disabled>ส่ง</button>
  </form>
  <p class="hint">ประวัติแชทอยู่ในหน้านี้เท่านั้น ปิดหน้าแล้วหาย · อย่าใส่รหัสผ่านหรือ API key</p>

  <script src="/assets/chat.js"></script>
</body>
</html>
