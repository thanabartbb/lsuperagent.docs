<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>สมัครใช้งาน — lsuperagen.docs</title>
<meta name="description" content="สมัครบัญชี lsuperagen.docs ด้วย Google หรือ GitHub"/>
<style>
:root{color-scheme:dark;--bg:#000000;--line:#2a3745;--text:#FFFFFF;--muted:#9aa3ad;--accent:#0FA3D9;--sans:Inter,"Noto Sans Thai",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:var(--sans);display:grid;place-items:center;padding:24px}
a{color:inherit;text-decoration:none}
.card{width:min(100%,520px);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,5vw,36px);background:linear-gradient(180deg,#0a0a0b,#000)}
.brand{text-align:center;font-weight:850;font-size:1.1rem;letter-spacing:-.03em}
.brand span{color:var(--muted);font-weight:600}
h1{margin:28px 0 0;text-align:center;font-size:clamp(1.8rem,6vw,2.4rem);letter-spacing:-.04em}
.lede{margin:12px 0 0;text-align:center;color:var(--muted);line-height:1.55}
.actions{display:grid;gap:12px;margin-top:28px}
.btn{min-height:58px;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;background:#08090b}
.btn:hover{border-color:rgba(15,163,217,.55);background:rgba(15,163,217,.06)}
.btn.primary{background:var(--accent);color:#001219;border-color:transparent}
.foot{margin-top:24px;text-align:center;color:var(--muted);font-size:.92rem}
.foot a{color:var(--accent);font-weight:750}
</style>
</head>
<body data-ls-platform-register="v2-unified-shell">
<main class="card" aria-labelledby="signup-title">
<p class="brand">lsuperagen<span>.docs</span></p>
<h1 id="signup-title" lang="th">สมัครใช้งาน</h1>
<p class="lede" lang="th">สร้างบัญชีด้วย Google หรือ GitHub แล้วเข้า AI Workspace ได้ทันที</p>
<div class="actions" aria-label="ทางสมัคร">
<a class="btn" href="/auth/google" data-firebase-provider="google">สมัครด้วย Google</a>
<a class="btn" href="/auth/github" data-firebase-provider="github">สมัครด้วย GitHub</a>
</div>
<p class="foot" lang="th">มีบัญชีแล้ว? <a href="/login">เข้าสู่ระบบ</a></p>
</main>
<script type="module" src="/firebase-auth.js"></script>
</body>
</html>
