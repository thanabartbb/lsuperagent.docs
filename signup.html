<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><link rel="icon" type="image/svg+xml" href="/logo.svg"><title>สมัครใช้งาน · LSUPERAGENT SDK</title><style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000000;
      --surface: #10111c;
      --border: #2a2a2a;
      --border-hover: #3a3a3a;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --accent: #e9a077;
      --btn-white: #f5f5f5;
      --btn-white-text: #10111c;
      --radius: 12px;
      --radius-sm: 8px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px 16px;
    }

    .login {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #141414;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .logo-wrap svg {
      width: 44px;
      height: 44px;
    }

    /* Brand title */
    .brand {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 36px;
      text-align: center;
    }

    .brand .sdk {
      color: var(--accent);
      font-weight: 600;
    }

    /* Form */
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      position: relative;
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field input::placeholder {
      color: var(--text-muted);
    }

    .field input:focus {
      border-color: #4a4a4a;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
    }

    .btn-primary {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: var(--radius);
      background: var(--btn-white);
      color: var(--btn-white-text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      background: #e8e8e8;
    }

    .btn-primary:active {
      transform: scale(0.985);
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 16px 0 12px;
    }

    /* Provider buttons */
    .providers {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-provider {
      position: relative;
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      text-decoration: none;
    }

    .btn-provider:hover {
      background: #171725;
      border-color: var(--border-hover);
    }

    .btn-provider:active {
      transform: scale(0.985);
    }

    .btn-provider .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .btn-provider .icon svg {
      width: 18px;
      height: 18px;
    }

    .badge {
      position: absolute;
      top: -8px;
      right: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      line-height: 1.2;
      white-space: nowrap;
      box-shadow: 0 0 0 2px var(--bg);
    }

    /* Footer links */
    .more-options {
      margin-top: 20px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      padding: 8px;
    }

    .more-options:hover {
      color: var(--text-muted);
    }

    .signup {
      margin-top: 28px;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
    }

    .signup a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    /* Sign-in states (password step, messages) */
    [hidden] { display: none !important; }

    .auth-msg {
      width: 100%;
      margin-top: 12px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text-muted);
      text-align: center;
      min-height: 1.3em;
    }

    .auth-msg.err { color: var(--text); }
    .auth-msg[data-state="error"] { color: #ffaaaa; }
    .auth-msg[data-state="success"] { color: #9de2ff; }
    .auth-links { width: 100%; display: flex; justify-content: flex-end; margin: 8px 0 18px; }
    .auth-links a { color: var(--text-muted); font-size: .85rem; text-decoration: none; }
    .auth-links a:hover { color: var(--text); }
    .signup a { color: var(--accent); }

    .ts-wrap { display: flex; justify-content: center; min-height: 0; }

    .btn-primary:disabled { opacity: 0.6; cursor: wait; }

    /* Subtle focus ring for keyboard */
    .btn-primary:focus-visible,
    .btn-provider:focus-visible,
    .more-options:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style><link rel="stylesheet" href="/assets/layout.css?v=1">

    </div><h1 class="brand">LSUPERAGENT <span class="sdk">SDK</span></h1><h2 style="font-size:1.1rem;font-weight:600;margin-bottom:22px">สมัครใช้งาน</h2><form data-email-register aria-label="สมัครบัญชี"><label class="field"><input name="email" type="email" autocomplete="email" placeholder="อีเมล" required></label><label class="field"><input name="password" type="password" autocomplete="new-password" minlength="6" placeholder="รหัสผ่าน อย่างน้อย 6 ตัว" required></label><label class="field"><input name="password_confirm" type="password" autocomplete="new-password" minlength="6" placeholder="ยืนยันรหัสผ่าน" required></label><button class="btn-primary" type="submit">สร้างบัญชี</button></form><div class="divider" aria-hidden="true"></div><div class="providers"><a class="btn-provider" href="/auth/google?return_to=/home">สมัครด้วย Google</a><a class="btn-provider" href="/auth/github?return_to=/home">สมัครด้วย GitHub</a></div><p class="auth-msg" id="auth-notice" role="status" aria-live="polite"></p><p class="signup">มีบัญชีแล้ว? <a href="/login">เข้าสู่ระบบ</a></p></main><script type="module" src="/firebase-auth.js"></script></body></html>
