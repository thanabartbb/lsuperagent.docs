<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#000000"/>
  <title>สมัครใช้งาน | lsuperagen.docs</title>
  <meta name="description" content="สมัครบัญชี lsuperagen.docs ด้วยอีเมล หรือ Google/GitHub"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{color-scheme:dark;--bg:#000;--text:#fff;--muted:#9aa3ad;--accent:#0fa3d9;--accent-bright:#10b8ff;--line:rgba(104,128,154,.55);--sans:Inter,"Noto Sans Thai",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
    body::before,body::after{content:"";position:fixed;z-index:0;width:46vw;aspect-ratio:1;border-radius:50%;pointer-events:none;border:1.5px solid rgba(16,184,255,.85);box-shadow:0 0 26px rgba(15,163,217,.85),inset 0 0 42px rgba(15,163,217,.22);background:radial-gradient(circle at 70% 68%,rgba(10,68,109,.22),rgba(0,0,0,.95) 62%)}
    body::before{left:-30vw;top:-25vw}body::after{right:-30vw;bottom:-30vw}
    a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}
    .screen{position:relative;z-index:1;width:min(100%,860px);margin:0 auto;min-height:100svh;padding:max(34px,env(safe-area-inset-top)) clamp(22px,6vw,72px) max(42px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
    .brand{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:clamp(6px,3vh,28px)}
    .wordmark{font-size:clamp(1.4rem,5vw,2rem);font-weight:850;letter-spacing:-.05em}.wordmark span{color:var(--accent-bright);font-weight:600}
    .eyebrow{margin-top:12px;color:#b1bdd0;font-size:.72rem;letter-spacing:.38em;text-transform:uppercase}
    h1{margin:clamp(24px,4vh,40px) 0 0;font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:-.05em;text-align:center}
    .lede{margin:12px auto 0;max-width:560px;text-align:center;color:var(--muted);line-height:1.55}
    .login-card{width:100%;margin-top:28px;padding:clamp(20px,4vw,36px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(10,15,20,.82),rgba(3,7,10,.9))}
    .fields{display:grid;gap:14px}
    .field{height:68px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(17,23,30,.9),rgba(10,15,20,.92));padding:0 20px}
    .field:focus-within{border-color:rgba(15,163,217,.9)}
    .field svg{width:24px;height:24px;stroke:#94a4bb}
    .field input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:1.05rem}
    .field input::placeholder{color:#75849a}
    .primary{width:100%;min-height:68px;margin-top:18px;border:0;border-radius:18px;background:linear-gradient(100deg,#10bcff,#0fa3d9,#13b7ff);color:#fff;font-size:1.15rem;font-weight:850}
    .notice{display:none;margin:14px 0 0;text-align:center;color:#ff9c9c;font-size:.94rem}.notice:not(:empty){display:block}.notice[data-state="success"]{color:#9de2ff}
    .divider{width:100%;display:grid;grid-template-columns:1fr auto 1fr;gap:20px;margin:28px 0 20px;color:var(--muted);align-items:center}
    .divider::before,.divider::after{content:"";height:1px;background:linear-gradient(90deg,transparent,rgba(130,154,182,.68))}
    .divider::after{background:linear-gradient(90deg,rgba(130,154,182,.68),transparent)}
    .socials{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .social{min-height:62px;border:1px solid var(--line);border-radius:17px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:760;background:rgba(10,14,19,.95)}
    .google-g{font-size:1.4rem;font-weight:950;background:conic-gradient(from -28deg,#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 75%,#ea4335 0);-webkit-background-clip:text;background-clip:text;color:transparent}
    .foot{margin-top:28px;text-align:center;color:var(--muted)}.foot a{color:var(--accent-bright);font-weight:780}
  </style>
</head>
<body data-ls-platform-register="v3-email">
  <main class="screen">
    <header class="brand" aria-label="lsuperagen.docs">
      <div class="wordmark">lsuperagen<span>.docs</span></div>
      <div class="eyebrow">YOUR AI WORKSPACE</div>
    </header>
    <h1 id="signup-title">สมัครใช้งาน</h1>
    <p class="lede">สร้างบัญชีด้วยอีเมลของแพลตฟอร์ม หรือใช้ Google / GitHub</p>

    <form class="login-card" data-email-register novalidate aria-labelledby="signup-title">
      <div class="fields">
        <label class="field" aria-label="อีเมล">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          <input name="email" type="email" autocomplete="email" placeholder="อีเมล" required/>
          <span aria-hidden="true"></span>
        </label>
        <label class="field" aria-label="รหัสผ่าน">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input name="password" type="password" autocomplete="new-password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" minlength="6" required/>
          <span aria-hidden="true"></span>
        </label>
        <label class="field" aria-label="ยืนยันรหัสผ่าน">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input name="password_confirm" type="password" autocomplete="new-password" placeholder="ยืนยันรหัสผ่าน" minlength="6" required/>
          <span aria-hidden="true"></span>
        </label>
      </div>
      <button class="primary" type="submit">สร้างบัญชี →</button>
      <p class="notice" id="auth-notice" role="status" aria-live="polite"></p>
    </form>

    <div class="divider" aria-hidden="true"><span>หรือ</span></div>
    <div class="socials" aria-label="สมัครด้วยบัญชีภายนอก">
      <a class="social" href="/auth/google" data-firebase-provider="google"><span class="google-g" aria-hidden="true">G</span><span>Google</span></a>
      <a class="social" href="/auth/github" data-firebase-provider="github"><span>GitHub</span></a>
      <a class="social" href="/auth/google" data-firebase-provider="google"><span>Gmail</span></a>
    </div>
    <p class="foot">มีบัญชีแล้ว? <a href="/login">เข้าสู่ระบบ</a></p>
  </main>
  <script type="module" src="/firebase-auth.js"></script>
</body>
</html>
