name: Image Error Telemetry

on:
  push:
    paths:
      - '.github/workflows/image-error-telemetry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add non-secret provider error classification
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/index.js')
          text = path.read_text()
          old = "if (!response.ok) return json({ ok: false, status: 'service_error', message: response.status === 429 ? 'บริการสร้างภาพถูกใช้งานหนาแน่น กรุณาลองใหม่อีกครั้ง' : 'ไม่สามารถสร้างภาพจากคำขอนี้ได้ กรุณาลองปรับคำอธิบาย' }, response.status === 429 ? 429 : 502, baseHeaders);"
          new = "if (!response.ok) return json({ ok: false, status: 'service_error', message: response.status === 429 ? 'บริการสร้างภาพถูกใช้งานหนาแน่น กรุณาลองใหม่อีกครั้ง' : 'ไม่สามารถสร้างภาพจากคำขอนี้ได้ กรุณาลองปรับคำอธิบาย', error_code: data && data.error && data.error.code ? String(data.error.code).slice(0, 80) : null, error_type: data && data.error && data.error.type ? String(data.error.type).slice(0, 80) : null, provider_status: response.status }, response.status === 429 ? 429 : 502, baseHeaders);"
          if old not in text:
              raise SystemExit('expected image error return not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify before commit
        run: |
          node --check src/index.js
          node --test tests/*.test.mjs
      - name: Commit telemetry and remove one-shot workflow
        run: |
          git config user.name 'THNB SMK'
          git config user.email '326990420+thanabartbb@users.noreply.github.com'
          git add src/index.js
          git rm .github/workflows/image-error-telemetry.yml
          git commit -m 'fix: classify image provider errors safely'
          git push
