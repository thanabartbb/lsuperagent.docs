name = "lsuperagent-docs"
main = "src/firebase-worker.js"
compatibility_date = "2026-09-30"
workers_dev = true

[[routes]]
pattern = "agents-sdk.space"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

# Internal Cloudflare Agent runtime. The browser stays on agents-sdk.space.
[[services]]
binding = "AGENT_STARTER"
service = "agent-starter"

# Chat history (src/chat-store.js). Schema: migrations/0001_chat_history.sql
[[d1_databases]]
binding = "DB"
database_name = "agentssdkspace"
database_id = "cd8c2695-040b-443c-8bbd-6d798d72a0d5"
migrations_dir = "migrations"

# Mirrors dashboard-only config on the live Worker (version 340, 2026-10-11) so a
# wrangler deploy/versions upload does not drop it.
[[durable_objects.bindings]]
name = "Durable_Ob_ject"
class_name = "ChatAgent"
script_name = "agent-starter"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
