<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>เข้าสู่ระบบ | LSUPERAGENT</title>
  <meta name="description" content="เข้าสู่ LSUPERAGENT ด้วยบัญชี Google หรือ GitHub"/>
  <style>
    :root { --bg:#000; --panel:#0b0b0b; --line:#292929; --text:#fff; --muted:#a9a9a9; --accent:#0fa3d9; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% -10%,#082331 0,transparent 34%),var(--bg); color:var(--text); font-family:Inter,"Noto Sans Thai",system-ui,sans-serif; }
    main { width:min(100%,460px); }
    .brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:34px; font-weight:800; letter-spacing:-.03em; font-size:1.05rem; }
    .mark { display:grid; place-items:center; width:34px; height:34px; border-radius:9px; background:var(--accent); color:#00111a; font-size:.78rem; }
    .card { border:1px solid var(--line); border-radius:20px; background:rgba(11,11,11,.92); padding:clamp(26px,7vw,38px); box-shadow:0 24px 70px rgba(0,0,0,.45); }
    h1 { margin:0; text-align:center; font-size:clamp(1.75rem,7vw,2.2rem); letter-spacing:-.045em; }
    p { margin:12px 0 0; color:var(--muted); text-align:center; line-height:1.65; }
    .actions { display:grid; gap:12px; margin-top:30px; }
    .provider { min-height:56px; display:flex; align-items:center; justify-content:center; gap:12px; border:1px solid #3a3a3a; border-radius:12px; background:#151515; color:#fff; text-decoration:none; font-weight:700; transition:border-color .16s,background .16s; }
    .provider:hover,.provider:focus-visible { border-color:var(--accent); background:#1a1a1a; outline:none; }
    .provider[aria-busy="true"] { opacity:.7; pointer-events:none; }
    .icon { width:21px; height:21px; display:grid; place-items:center; font-weight:900; }
    .github { font-size:22px; line-height:1; }
    .notice { min-height:22px; margin-top:18px; color:#ffb4b4; font-size:.86rem; text-align:center; }
    .terms { margin-top:25px; font-size:.78rem; color:#777; }
  </style>
</head>
<body data-ls-login-auth="v3">
  <main>
    <div class="brand" aria-label="LSUPERAGENT"><span class="mark">LS</span><span>LSUPERAGENT</span></div>
    <section class="card" aria-labelledby="login-title">
      <h1 id="login-title">เข้าสู่ AI Workspace</h1>
      <p>เลือกบัญชีที่ต้องการใช้เพื่อเริ่มสนทนา เขียนโค้ด ค้นคว้า และสร้างภาพ</p>
      <div class="actions">
        <a class="provider" href="/auth/google" data-firebase-provider="google"><span class="icon" aria-hidden="true">G</span><span>Continue with Google</span></a>
        <a class="provider" href="/auth/github" data-firebase-provider="github"><span class="icon github" aria-hidden="true">●</span><span>Continue with GitHub</span></a>
      </div>
      <div class="notice" id="auth-notice" role="status"></div>
      <p class="terms">การเข้าสู่ระบบหมายถึงคุณยอมรับการใช้งานอย่างรับผิดชอบ</p>
    </section>
  </main>
  <script>
    const error = new URLSearchParams(location.search).get('auth_error');
    if (error) document.getElementById('auth-notice').textContent = 'ไม่สามารถเข้าสู่ระบบได้ กรุณาลองอีกครั้ง';
  </script>
  <script type="module" src="/firebase-auth.js"></script>
</body>
</html>
