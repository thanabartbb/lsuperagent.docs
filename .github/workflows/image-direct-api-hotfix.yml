name: Image Direct API Hotfix

on:
  push:
    paths:
      - '.github/workflows/image-direct-api-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace Responses image tool with Images API
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/index.js')
          source = source_path.read_text()
          replacement = r'''async function handleImage(request, env) {
            if (request.method !== 'POST') return json({ ok: false, status: 'method_not_allowed', message: 'ส่งคำขอด้วย POST เท่านั้น' }, 405, { allow: 'POST, OPTIONS' });
            let body = {};
            try { body = await request.json(); } catch (_) { body = {}; }
            const prompt = typeof body.prompt === 'string' ? body.prompt.trim() : '';
            if (!prompt) return json({ ok: false, status: 'validation_error', message: 'กรุณาอธิบายภาพที่ต้องการสร้าง' }, 400);
            if (prompt.length > 12000) return json({ ok: false, status: 'validation_error', message: 'คำอธิบายภาพยาวเกินขีดจำกัด 12,000 ตัวอักษร' }, 413);
            const rate = checkRateLimit(request, 'image');
            const baseHeaders = rateLimitHeaders(rate);
            if (rate.limited) return json({ ok: false, status: 'rate_limited', message: 'ส่งคำขอถี่เกินไป กรุณารอสักครู่แล้วลองอีกครั้ง' }, 429, baseHeaders);
            if (!env.OPENAI_API_KEY) return json({ ok: false, status: 'service_unavailable', message: 'บริการสร้างภาพยังไม่พร้อมใช้งานในขณะนี้' }, 503, baseHeaders);

            const requestId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
            const models = ['gpt-image-2.5-flare', 'gpt-image-2'];
            let lastData = {};
            let lastStatus = 502;
            for (const model of models) {
              const response = await fetch('https://api.openai.com/v1/images/generations', {
                method: 'POST',
                headers: { authorization: 'Bearer ' + env.OPENAI_API_KEY, 'content-type': 'application/json', 'x-client-request-id': requestId },
                body: JSON.stringify({ model, prompt })
              }).catch(() => null);
              if (!response) return json({ ok: false, status: 'service_error', message: 'เชื่อมต่อบริการสร้างภาพไม่สำเร็จ กรุณาลองใหม่' }, 502, baseHeaders);

              const raw = await response.text();
              let data = {};
              try { data = raw ? JSON.parse(raw) : {}; } catch (_) { data = {}; }
              if (response.ok) {
                const item = Array.isArray(data.data) ? data.data[0] : null;
                const imageBase64 = item && typeof item.b64_json === 'string' ? item.b64_json : '';
                if (!imageBase64) return json({ ok: false, status: 'empty_result', message: 'บริการสร้างภาพไม่ได้ส่งไฟล์ภาพกลับมา กรุณาลองใหม่' }, 502, baseHeaders);
                return json({ ok: true, status: 'completed', image: { mime_type: 'image/png', data_base64: imageBase64, filename: 'lsuperagen-image.png', revised_prompt: item && typeof item.revised_prompt === 'string' ? item.revised_prompt : null } }, 200, baseHeaders);
              }
              lastData = data;
              lastStatus = response.status;
              if (response.status === 401 || response.status === 403 || response.status === 429) break;
            }
            return json({
              ok: false,
              status: 'service_error',
              message: lastStatus === 429 ? 'บริการสร้างภาพถูกใช้งานหนาแน่น กรุณาลองใหม่อีกครั้ง' : 'ไม่สามารถสร้างภาพจากคำขอนี้ได้ กรุณาลองปรับคำอธิบาย',
              error_code: lastData && lastData.error && lastData.error.code ? String(lastData.error.code).slice(0, 80) : null,
              error_type: lastData && lastData.error && lastData.error.type ? String(lastData.error.type).slice(0, 80) : null,
              error_param: lastData && lastData.error && lastData.error.param ? String(lastData.error.param).slice(0, 80) : null,
              provider_status: lastStatus
            }, lastStatus === 429 ? 429 : 502, baseHeaders);
          }

          function plannedEndpoint'''
          updated, count = re.subn(r"async function handleImage\(request, env\) \{[\s\S]*?\n\}\n\nfunction plannedEndpoint", replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'expected one handleImage block, replaced {count}')
          source_path.write_text(updated)

          test_path = Path('tests/public-product.test.mjs')
          tests = test_path.read_text()
          old = "  assert.match(source, /type:\\s*['\"]image_generation['\"]/);\n  assert.match(source, /image_generation_call/);"
          new = "  assert.match(source, /\\/v1\\/images\\/generations/);\n  assert.match(source, /gpt-image-2\\.5-flare/);\n  assert.match(source, /b64_json/);"
          if old not in tests:
              raise SystemExit('expected image assertions not found')
          test_path.write_text(tests.replace(old, new, 1))
          PY
      - name: Verify before commit
        run: |
          node --check src/index.js
          node --test tests/*.test.mjs
      - name: Commit verified image flow and remove one-shot workflow
        run: |
          git config user.name 'THNB SMK'
          git config user.email '326990420+thanabartbb@users.noreply.github.com'
          git add src/index.js tests/public-product.test.mjs
          git rm .github/workflows/image-direct-api-hotfix.yml
          git commit -m 'fix: generate images through the Images API'
          git push
