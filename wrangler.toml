name = "lsuperagent-docs"
main = "src/firebase-worker.js"
compatibility_date = "2026-09-30"
workers_dev = true
routes = [{ pattern = "agents-sdk.space", custom_domain = true }]

[assets]
directory = "."
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

# Chat history (src/chat-store.js). Schema: migrations/0001_chat_history.sql
[[d1_databases]]
binding = "DB"
database_name = "agentssdkspace"
database_id = "cd8c2695-040b-443c-8bbd-6d798d72a0d5"
migrations_dir = "migrations"
