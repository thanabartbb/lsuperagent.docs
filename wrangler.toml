name = "lsuperagent-docs"
main = "src/firebase-worker.js"
compatibility_date = "2026-09-30"
workers_dev = true
routes = [{ pattern = "agents-sdk.space", custom_domain = true }]

[assets]
directory = "."
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

# Internal Cloudflare Agent runtime. The browser stays on agents-sdk.space.
[[services]]
binding = "AGENT_STARTER"
service = "agent-starter"


        "name": "AGENT_STARTER",
        "type": "service",
        "service": "agent-starter",
        "environment": "production"
      
      
        "name": "durable_objec_agents",
        "type": "durable_object_namespace",
        "class_name": "ChatAgent",
        "script_name": "agent-starter",
        "namespace_id": "76c920e8f4fb46e2a8332ac8ce04c0b2"
      

  "d1_databases": [
    {
      "binding": "DB",
      "database_id": "cd8c2695-040b-443c-8bbd-6d798d72a0d5"
    
  "analytics_engine_datasets": [
    {
      "binding": "PUBLIC_AGENT",
      "dataset": "DB2"

# Chat history (src/chat-store.js). Schema: migrations/0001_chat_history.sql
[[d1_databases]]
binding = "DB"
database_name = "agentssdkspace"
database_id = "cd8c2695-040b-443c-8bbd-6d798d72a0d5"
migrations_dir = "migrations"
