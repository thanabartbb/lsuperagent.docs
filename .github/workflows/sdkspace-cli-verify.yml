name: SDKSPACE CLI Verify
on:
  push:
    paths:
      - 'packages/sdkspace-cli/**'
      - '.github/workflows/sdkspace-cli-verify.yml'
  pull_request:
    paths:
      - 'packages/sdkspace-cli/**'
      - '.github/workflows/sdkspace-cli-verify.yml'
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CLI tests
        working-directory: packages/sdkspace-cli
        run: npm test
      - name: Publish tarball contents (dry run)
        working-directory: packages/sdkspace-cli
        run: |
          npm pack --dry-run --json > /tmp/sdkspace-pack.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/sdkspace-pack.json'))[0];for(const f of ['templates/next/gitignore.template','templates/worker/gitignore.template','templates/next/app/api/chat/route.js','templates/worker/src/index.mjs']){if(!p.files.some(x=>x.path===f))process.exitCode=1}"
